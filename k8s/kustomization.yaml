# kubectl apply -k k8s/   (Docker Desktop Kubernetes; build the image first: docker build -t ascstats:dev .)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ascstats
labels:
  - pairs: {app.kubernetes.io/part-of: ascstats}
    includeSelectors: false

resources:
  - namespace.yaml
  - postgres.yaml
  - minio.yaml
  - web.yaml
  - cronjobs.yaml

# Stable names: Airflow's KubernetesPodOperator pods reference these from outside Kustomize.
# Without the hash suffix a config change no longer rolls the Deployment by itself:
# run `kubectl -n ascstats rollout restart deploy/web` after changing them.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: ascstats-config
    literals:
      # Synthetic by default. Real data is switched on in the cluster only, so no account
      # numbers ever land in git (later envFrom sources win over this ConfigMap):
      #   kubectl -n ascstats create secret generic asc-settings \
      #     --from-literal=ASC_SOURCE=asc --from-literal=ASC_VENDOR_NUMBER=8xxxxxxx
      - ASC_SOURCE=synthetic
      - ASC_KEY_PATH=/var/run/secrets/asc/AuthKey.p8
      - RAW_STORAGE_URL=s3://ascstats-raw
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_DEFAULT_REGION=us-east-1
      - DJANGO_ALLOWED_HOSTS=*
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:8000

# Dev-only credentials so the stack comes up with one command. For any shared cluster delete
# this generator and create the Secrets from secrets/*.example.yaml (or External Secrets).
secretGenerator:
  - name: ascstats-db
    envs: [secrets/dev-db.env]
  - name: ascstats-app
    envs: [secrets/dev-app.env]

images:
  - name: ascstats
    newName: ascstats
    newTag: dev
