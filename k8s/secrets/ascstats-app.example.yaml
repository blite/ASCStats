# Template for non-dev clusters (replaces the secretGenerator in kustomization.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: ascstats-app
  namespace: ascstats
type: Opaque
stringData:
  DATABASE_URL: postgres://ascstats:CHANGE_ME@postgres:5432/ascstats
  DJANGO_SECRET_KEY: CHANGE_ME
  AWS_ACCESS_KEY_ID: CHANGE_ME
  AWS_SECRET_ACCESS_KEY: CHANGE_ME
  MINIO_ROOT_USER: CHANGE_ME
  MINIO_ROOT_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: ascstats-db
  namespace: ascstats
type: Opaque
stringData:
  POSTGRES_USER: ascstats
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: ascstats
