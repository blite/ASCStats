# Template only, never commit a real key. Usually create the Secret from this machine's
# ~/.appstoreconnect setup with:
#
#   k8s/scripts/asc-secret-from-local.sh
#
# or by hand from a downloaded key:
#
#   kubectl -n ascstats create secret generic asc-api-key \
#     --from-file=AuthKey.p8=$HOME/keys/AuthKey_XXXXXXXXXX.p8 \
#     --from-literal=ASC_KEY_ID=XXXXXXXXXX \
#     --from-literal=ASC_ISSUER_ID=00000000-0000-0000-0000-000000000000
#
# The .p8 is mounted as a file at /var/run/secrets/asc/AuthKey.p8 and read in exactly one
# place (ascstats/asc/credentials.py). The IDs are exposed as env vars; they are not secret
# on their own but live next to the key they describe.
apiVersion: v1
kind: Secret
metadata:
  name: asc-api-key
  namespace: ascstats
type: Opaque
stringData:
  ASC_KEY_ID: XXXXXXXXXX
  ASC_ISSUER_ID: 00000000-0000-0000-0000-000000000000
  AuthKey.p8: |
    -----BEGIN PRIVATE KEY-----
    (contents of AuthKey_XXXXXXXXXX.p8)
    -----END PRIVATE KEY-----
