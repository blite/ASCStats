apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  # A single-replica database: keep its DNS record even while a probe is failing, so a
  # momentary probe timeout does not become "could not resolve host" in every client.
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          # Query statistics (pg_stat_statements) so tuning starts from measurements, and a
          # page cost that matches SSD-backed volumes.
          args: ["-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top", "-c", "random_page_cost=1.1"]
          envFrom: [{secretRef: {name: ascstats-db}}]
          ports: [{containerPort: 5432, name: postgres}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]}
            periodSeconds: 5
            timeoutSeconds: 5 # the 1s default flaps when a backfill starts many pods at once
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
