# Separate uv project: Airflow's dependency tree never touches the Django image.
[project]
name = "ascstats-airflow"
version = "0.1.0"
description = "Airflow DAGs that orchestrate ascstats management commands on Kubernetes."
requires-python = ">=3.13,<3.14"
dependencies = [
    "apache-airflow==3.3.2",
    "apache-airflow-providers-cncf-kubernetes>=10.24",
]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "AIR", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ascstats_lib", "tests"]
