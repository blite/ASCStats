{% load stats_extras %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Sign in · ASCStats{% endblock %}</title>
  {% include "stats/_favicon.html" %}
  {% include "stats/_theme.html" %}
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: radial-gradient(900px 420px at 50% -10%, color-mix(in oklch, var(--primary) 14%, transparent), transparent 70%), var(--muted); }
    .auth { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px; }
    .auth.wide { max-width: 860px; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; text-decoration: none; }
    .brand svg { width: 24px; height: 24px; }
    .panel { display: grid; padding: 0; overflow: hidden; }
    .auth.wide .panel { grid-template-columns: 1fr 1fr; }
    .panel form { display: flex; flex-direction: column; gap: 24px; padding: 32px; }
    .head { text-align: center; }
    .head h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
    .head p { margin: 4px 0 0; color: var(--muted-foreground); font-size: 14px; text-wrap: balance; }
    .field { display: grid; gap: 8px; }
    .art { position: relative; margin: 0; min-height: 320px; background: var(--muted); border-left: 1px solid var(--border); }
    .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .art::after { content: ""; position: absolute; inset: 55% 0 0; background: linear-gradient(transparent, var(--muted) 55%); }
    .art figcaption { z-index: 1; }
    .art figcaption { position: absolute; left: 24px; right: 24px; bottom: 22px; font-size: 13px; color: var(--muted-foreground); }
    .art figcaption strong { display: block; color: var(--foreground); font-size: 15px; }
    .fine { text-align: center; font-size: 12px; color: var(--muted-foreground); text-wrap: balance; }
    @media (max-width: 767px) { .auth.wide .panel { grid-template-columns: 1fr; } .art { display: none; } }
  </style>
</head>
<body>
<main class="auth{% block width %}{% endblock %}">
  <span class="brand">
    <svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--primary)"/>
      <path d="M6 18l4.5-5 3.5 3 6-8" fill="none" stroke="var(--primary-foreground)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    ASCStats
  </span>
  {% block content %}{% endblock %}
</main>
</body>
</html>
