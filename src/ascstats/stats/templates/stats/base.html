<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ASCStats{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
  <style>
    :root {
      color-scheme: light;
      --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff;
      --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
      --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,.10);
      --series-1: #2a78d6; --series-1-strong: #1c5cab;
      --up: #2a78d6; --down: #e34948; --neutral: #898781;
      --good-text: #006300; --bad-text: #d03b3b;
      --st-good: #0ca30c; --st-empty: #e1e0d9; --st-failed: #d03b3b; --st-none: transparent;
      --lane-fill: rgba(82,81,78,.10); --lane-line: #52514e;
      --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --other: #b8b7b1;
      --hero-glow: radial-gradient(1200px 380px at 12% -10%, rgba(42,120,214,.16), transparent 60%),
                   radial-gradient(900px 320px at 95% 0%, rgba(227,73,72,.08), transparent 60%);
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) {
        color-scheme: dark;
        --page: #0d0d0d; --surface: #1a1a19; --raised: #222221;
        --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
        --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
        --series-1: #3987e5; --series-1-strong: #6da7ec;
        --up: #3987e5; --down: #e66767; --neutral: #898781;
        --good-text: #0ca30c; --bad-text: #e66767;
        --st-empty: #2c2c2a;
        --lane-fill: rgba(195,194,183,.10); --lane-line: #c3c2b7;
        --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --other: #5c5b57;
        --hero-glow: radial-gradient(1200px 380px at 12% -10%, rgba(57,135,229,.22), transparent 60%),
                     radial-gradient(900px 320px at 95% 0%, rgba(230,103,103,.10), transparent 60%);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --raised: #222221;
      --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
      --series-1: #3987e5; --series-1-strong: #6da7ec;
      --up: #3987e5; --down: #e66767; --neutral: #898781;
      --good-text: #0ca30c; --bad-text: #e66767;
      --st-empty: #2c2c2a;
      --lane-fill: rgba(195,194,183,.10); --lane-line: #c3c2b7;
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --other: #5c5b57;
      --hero-glow: radial-gradient(1200px 380px at 12% -10%, rgba(57,135,229,.22), transparent 60%),
                   radial-gradient(900px 320px at 95% 0%, rgba(230,103,103,.10), transparent 60%);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
           color: var(--ink); background: var(--hero-glow), var(--page); background-repeat: no-repeat; }
    a { color: inherit; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 48px; }
    header { display: flex; align-items: center; gap: 12px; padding: 20px 0 8px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; }
    .brand svg { width: 26px; height: 26px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2);
            border: 1px solid var(--ring); border-radius: 999px; padding: 3px 10px; background: var(--surface); }
    .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--st-good); box-shadow: 0 0 0 0 rgba(12,163,12,.5);
             animation: pulse 2.4s infinite; }
    .tabs { margin-left: 8px !important; background: var(--surface); border: 1px solid var(--ring); border-radius: 999px; padding: 3px; gap: 2px !important; }
    .tabs a { padding: 3px 12px; border-radius: 999px; }
    .tabs a[aria-current="page"] { background: var(--ink); color: var(--surface); }
    header nav:last-of-type { margin-left: auto; }
    header nav { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); }
    header nav a { text-decoration: none; } header nav a:hover { color: var(--ink); }
    .hero { padding: 36px 0 18px; }
    .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
    .hero h1 { font-size: clamp(30px, 5vw, 52px); line-height: 1.05; letter-spacing: -.03em; margin: 0; font-weight: 700; max-width: 18ch; }
    .hero h1 .num { color: var(--series-1); }
    .hero p { color: var(--ink-2); font-size: 17px; max-width: 62ch; margin: 14px 0 0; }
    .chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 13px; white-space: nowrap; }
    .chip.up { color: var(--good-text); } .chip.down { color: var(--bad-text); } .chip.flat { color: var(--muted); }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0; }
    .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 16px; padding: 18px 20px; }
    .tile .label { font-size: 13px; color: var(--ink-2); }
    .tile .value { font-size: 34px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; margin: 4px 0 2px; }
    .tile .row { display: flex; align-items: end; justify-content: space-between; gap: 8px; }
    .tile svg { width: 120px; height: 32px; flex: none; }
    .tile .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .split { display: flex; gap: 14px; margin-top: 6px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
    .key { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot.up { background: var(--up); } .dot.down { background: var(--down); } .dot.neutral { background: var(--neutral); }
    .dot.unknown { border: 2px solid var(--neutral); }
    section.card { margin: 14px 0; }
    .card h2 { font-size: 19px; letter-spacing: -.01em; margin: 0; }
    .card .sub { color: var(--ink-2); font-size: 13px; margin: 4px 0 12px; max-width: 80ch; }
    .card-head { display: flex; gap: 16px; align-items: start; justify-content: space-between; flex-wrap: wrap; }
    .scroll { overflow-x: auto; }
    svg text { font-family: inherit; }
    .lane-name { font-size: 12.5px; fill: var(--ink); }
    .lane-total { font-size: 11px; fill: var(--muted); }
    .lane-area { fill: var(--lane-fill); }
    .lane-line { fill: none; stroke: var(--lane-line); stroke-width: 1.5; stroke-linejoin: round; }
    .rel { stroke: var(--surface); stroke-width: 2; cursor: pointer; }
    .rel.up { fill: var(--up); } .rel.down { fill: var(--down); } .rel.neutral { fill: var(--neutral); }
    .rel.unknown { fill: var(--surface); stroke: var(--neutral); }
    .rel:hover, .rel:focus { r: 7; outline: none; }
    .tick { font-size: 11px; fill: var(--muted); }
    .hair { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1; }
    .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    select { font: inherit; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--ring); background: var(--raised); color: var(--ink); }
    .seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 10px; overflow: hidden; background: var(--raised); }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg label { padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
    .seg input:checked + label { background: var(--ink); color: var(--surface); }
    .seg input:focus-visible + label { outline: 2px solid var(--series-1); outline-offset: -2px; }
    .two { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; }
    .cal rect { rx: 2.5; }
    .cal .loaded { fill: var(--st-good); } .cal .empty { fill: var(--st-empty); }
    .cal .failed { fill: var(--st-failed); } .cal .none { fill: none; stroke: var(--grid); }
    .c1 { fill: var(--c1); background: var(--c1); } .c2 { fill: var(--c2); background: var(--c2); } .c3 { fill: var(--c3); background: var(--c3); }
    .c4 { fill: var(--c4); background: var(--c4); } .c5 { fill: var(--c5); background: var(--c5); } .other { fill: var(--other); background: var(--other); }
    .sw { width: 11px; height: 11px; border-radius: 2.5px; display: inline-block; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-weight: 600; color: var(--ink-2); padding: 6px 8px; border-bottom: 1px solid var(--axis); }
    td { padding: 7px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
    td.num, th.num { text-align: right; }
    .muted { color: var(--muted); }
    details summary { cursor: pointer; color: var(--ink-2); font-size: 13px; margin-top: 10px; }
    #tip { position: fixed; z-index: 10; pointer-events: none; background: var(--raised); color: var(--ink);
           border: 1px solid var(--ring); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45;
           box-shadow: 0 8px 28px rgba(0,0,0,.18); max-width: 300px; }
    #tip .t { font-weight: 650; }
    footer { color: var(--muted); font-size: 12px; margin-top: 28px; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(12,163,12,.45); } 70% { box-shadow: 0 0 0 7px rgba(12,163,12,0); } 100% { box-shadow: 0 0 0 0 rgba(12,163,12,0); } }
    @keyframes reveal { from { clip-path: inset(0 100% 0 0); } }
    @keyframes rise { from { transform: scaleY(0); } }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
    .reveal { animation: reveal 1.6s cubic-bezier(.3,.7,.2,1) backwards; }
    .rise { transform-box: fill-box; transform-origin: bottom; animation: rise .7s cubic-bezier(.3,.7,.2,1) both; }
    .fade { animation: fade .6s ease both; }
    @media (prefers-reduced-motion: reduce) {
      .reveal, .rise, .fade, .pulse { animation: none; }
    }
    @media (max-width: 860px) { .grid4 { grid-template-columns: repeat(2, 1fr); } .two { grid-template-columns: 1fr; } }
    @media (max-width: 480px) { .grid4 { grid-template-columns: 1fr; } .tile .value { font-size: 30px; } }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--ink)"/>
        <path d="M6 18l4.5-5 3.5 3 6-8" fill="none" stroke="var(--surface)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ASCStats
    </div>
    {% if not empty %}<span class="pill"><span class="pulse"></span>App Store Connect · data through {{ end|date:"M j, Y" }}</span>{% endif %}
    <nav class="tabs" aria-label="Pages">
      <a href="{% url 'dashboard' %}"{% if page == "overview" %} aria-current="page"{% endif %}>Overview</a>
      <a href="{% url 'funnel' %}"{% if page == "funnel" %} aria-current="page"{% endif %}>Funnel</a>
      <a href="{% url 'revenue' %}"{% if page == "revenue" %} aria-current="page"{% endif %}>Revenue</a>
    </nav>
    <nav><a href="/api/docs">API</a><a href="/admin/">Admin</a></nav>
  </header>

  {% block content %}{% endblock %}
  <footer>ASCStats · read-only App Store Connect pipeline · Django, Postgres, Kubernetes, Airflow</footer>
</div>
<div id="tip" hidden></div>
<script>
  // One tooltip for every chart; works for content htmx swaps in later (event delegation).
  const tip = document.getElementById("tip");
  function show(el, x, y) {
    tip.replaceChildren(...el.dataset.tip.split("\n").map((line, i) => {
      const d = document.createElement("div"); d.textContent = line; if (i === 0) d.className = "t"; return d;
    }));
    tip.hidden = false;
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(x + 14, innerWidth - r.width - 8) + "px";
    tip.style.top = (y - r.height - 12 < 8 ? y + 18 : y - r.height - 12) + "px";
  }
  document.addEventListener("pointermove", e => {
    const el = e.target.closest?.("[data-tip]");
    if (el) show(el, e.clientX, e.clientY); else tip.hidden = true;
  });
  document.addEventListener("focusin", e => {
    const el = e.target.closest?.("[data-tip]");
    if (el) { const b = el.getBoundingClientRect(); show(el, b.right, b.top); }
  });
  document.addEventListener("focusout", () => { tip.hidden = true; });
</script>
</body>
</html>
