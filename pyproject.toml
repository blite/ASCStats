[project]
name = "ascstats"
version = "0.1.0"
description = "App Store Connect stats pipeline: raw reports to MinIO, Postgres via Django, served by Django Ninja."
authors = [{ name = "Ben Holloway" }]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-ninja>=1.7",
    "psycopg[binary]>=3.3",
    "pyjwt[crypto]>=2.15",
    "httpx>=0.28",
    "boto3>=1.43",
    "gunicorn>=26",
    "whitenoise>=6.12",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-django>=4.14",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["src/ascstats/stats/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ", "PT", "RUF"]
ignore = ["RUF012"]  # Django admin/Meta class attributes are lists by convention

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ascstats.settings"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]
