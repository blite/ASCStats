name: Demo site

# The synthetic demo as a static site on GitHub Pages: a fresh SQLite database, seeded with
# synthetic data only (export_site refuses anything else), rendered under /<repo>/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --locked
      - name: Export the synthetic demo
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/demo.sqlite3
          RAW_STORAGE_URL: file://${{ runner.temp }}/demo-raw
          ASC_SOURCE: synthetic
        run: >-
          uv run python manage.py export_site
          --out ${{ runner.temp }}/site --base-path /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v4
        with: {path: "${{ runner.temp }}/site"}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
