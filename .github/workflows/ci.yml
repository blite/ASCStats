name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_USER: ascstats, POSTGRES_PASSWORD: ascstats, POSTGRES_DB: ascstats}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ascstats" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://ascstats:ascstats@localhost:5432/ascstats
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  airflow:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: airflow}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true, cache-dependency-glob: airflow/uv.lock}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image (not pushed)
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ascstats:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Kustomize renders
        run: kubectl kustomize k8s/ > /dev/null
